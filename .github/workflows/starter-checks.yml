name: Starter checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Contract and negative cases
        run: python scripts/check_handoff.py --self-test
      - name: Preview consistency and available JavaScript syntax check
        run: python scripts/preview.py --check
      - name: Patch formatting
        run: git show --format= --check HEAD
